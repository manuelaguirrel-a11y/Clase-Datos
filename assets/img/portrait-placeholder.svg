<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder portrait</title>
  <desc id="desc">Monogram placeholder standing in for Manuel Aguirre's professional photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122B48"/>
      <stop offset="100%" stop-color="#0B1E33"/>
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#bg)"/>
  <rect x="24" y="24" width="432" height="552" fill="none" stroke="#C9A868" stroke-opacity="0.35" stroke-width="1"/>
  <text x="240" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#C9A868" fill-opacity="0.9" text-anchor="middle">MA</text>
  <text x="240" y="380" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#F6F4EF" fill-opacity="0.55" text-anchor="middle">MANUEL AGUIRRE</text>
</svg>
